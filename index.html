<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Аквариум</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050b14; font-family: system-ui, sans-serif; }
  #hint { position: fixed; left: 16px; bottom: 14px; color: #9cc9e8; font-size: 13px; opacity: .8; user-select: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hint">Мышь — вращать · колесо — зум · клик по аквариуму — покормить рыбок</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const W = 10, H = 6, D = 5; // размеры аквариума
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050b14);
scene.fog = new THREE.Fog(0x050b14, 18, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 3, 15);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.minDistance = 6;
controls.maxDistance = 30;

// Свет
scene.add(new THREE.HemisphereLight(0x9fd8ff, 0x1a2a3a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 12, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7 });
scene.add(sun);
const blueLight = new THREE.PointLight(0x2299ff, 30, 20);
blueLight.position.set(-3, 2, 2);
scene.add(blueLight);

// Стол
const table = new THREE.Mesh(new THREE.BoxGeometry(14, 0.6, 8), new THREE.MeshStandardMaterial({ color: 0x3b2716, roughness: 0.7 }));
table.position.y = -H / 2 - 0.45;
table.receiveShadow = true;
scene.add(table);

// Стекло
const glass = new THREE.Mesh(
  new THREE.BoxGeometry(W, H, D),
  new THREE.MeshPhysicalMaterial({ color: 0xbfe8ff, transparent: true, opacity: 0.12, roughness: 0.05, metalness: 0, side: THREE.DoubleSide, depthWrite: false })
);
scene.add(glass);
const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(W, H, D)), new THREE.LineBasicMaterial({ color: 0xd8f3ff, transparent: true, opacity: 0.6 }));
scene.add(edges);

// Вода
const water = new THREE.Mesh(
  new THREE.BoxGeometry(W - 0.05, H * 0.9, D - 0.05),
  new THREE.MeshPhysicalMaterial({ color: 0x1e7fb8, transparent: true, opacity: 0.18, roughness: 0.1, depthWrite: false })
);
water.position.y = -H * 0.05;
scene.add(water);

// Поверхность воды с волнами
const surfGeo = new THREE.PlaneGeometry(W - 0.05, D - 0.05, 40, 20);
surfGeo.rotateX(-Math.PI / 2);
const surface = new THREE.Mesh(surfGeo, new THREE.MeshPhysicalMaterial({ color: 0x6fd0ff, transparent: true, opacity: 0.35, roughness: 0.05, side: THREE.DoubleSide, depthWrite: false }));
surface.position.y = H / 2 - H * 0.1;
scene.add(surface);
const surfBase = surfGeo.attributes.position.array.slice();

// Песок
const sandGeo = new THREE.PlaneGeometry(W - 0.05, D - 0.05, 60, 30);
sandGeo.rotateX(-Math.PI / 2);
{
  const p = sandGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, Math.sin(x * 0.8) * 0.12 + Math.cos(z * 1.3 + x) * 0.08 + Math.random() * 0.03 - z * 0.06);
  }
  sandGeo.computeVertexNormals();
}
const sand = new THREE.Mesh(sandGeo, new THREE.MeshStandardMaterial({ color: 0xd9bf8a, roughness: 1 }));
sand.position.y = -H / 2 + 0.35;
sand.receiveShadow = true;
scene.add(sand);
const floorY = sand.position.y;

// Камни
const rockMat = new THREE.MeshStandardMaterial({ color: 0x6b6f75, roughness: 0.9, flatShading: true });
for (let i = 0; i < 9; i++) {
  const g = new THREE.DodecahedronGeometry(0.25 + Math.random() * 0.5, 0);
  const p = g.attributes.position;
  for (let j = 0; j < p.count; j++) p.setXYZ(j, p.getX(j) * (0.8 + Math.random() * 0.4), p.getY(j) * 0.7, p.getZ(j) * (0.8 + Math.random() * 0.4));
  g.computeVertexNormals();
  const r = new THREE.Mesh(g, rockMat.clone());
  r.material.color.offsetHSL(0, 0, (Math.random() - 0.5) * 0.15);
  r.position.set((Math.random() - 0.5) * (W - 1.5), floorY + 0.1, (Math.random() - 0.5) * (D - 1.5));
  r.rotation.y = Math.random() * 6;
  r.castShadow = r.receiveShadow = true;
  scene.add(r);
}

// Затонувший сундук
const chest = new THREE.Group();
const woodMat = new THREE.MeshStandardMaterial({ color: 0x6b3f1d, roughness: 0.8 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4a017, metalness: 0.9, roughness: 0.3 });
const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, 0.8), woodMat);
const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16, 1, false, 0, Math.PI), woodMat);
lid.rotation.z = Math.PI / 2; lid.position.y = 0.3;
const lidPivot = new THREE.Group(); lidPivot.position.set(0, 0, -0.4);
lid.position.z = 0.4; lidPivot.add(lid); lidPivot.position.y = 0;
const band = new THREE.Mesh(new THREE.BoxGeometry(1.22, 0.08, 0.82), goldMat); band.position.y = 0.2;
const coins = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), goldMat);
coins.scale.set(1.4, 0.4, 0.95); coins.position.y = 0.3;
chest.add(box, lidPivot, band, coins);
chest.traverse(o => { if (o.isMesh) o.castShadow = true; });
chest.position.set(2.6, floorY + 0.3, -0.8);
chest.rotation.y = -0.4;
scene.add(chest);
const chestBubbleSrc = new THREE.Vector3(2.6, floorY + 0.7, -0.8);

// Водоросли (сгибаются шейдером)
const plantUniforms = { uTime: { value: 0 } };
function makePlant(x, z, h, color) {
  const g = new THREE.PlaneGeometry(0.18 + Math.random() * 0.12, h, 1, 14);
  g.translate(0, h / 2, 0);
  const m = new THREE.MeshStandardMaterial({ color, side: THREE.DoubleSide, roughness: 0.6 });
  const phase = Math.random() * 10;
  m.onBeforeCompile = (s) => {
    s.uniforms.uTime = plantUniforms.uTime;
    s.vertexShader = 'uniform float uTime;\n' + s.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
       float k = position.y / ${h.toFixed(2)};
       transformed.x += sin(uTime * 1.3 + ${phase.toFixed(2)} + position.y * 1.5) * 0.35 * k * k;
       transformed.z += cos(uTime * 0.9 + ${phase.toFixed(2)}) * 0.2 * k * k;`);
  };
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(x, floorY, z);
  mesh.rotation.y = Math.random() * Math.PI;
  mesh.castShadow = true;
  scene.add(mesh);
}
const greens = [0x2e8b3a, 0x3fa34d, 0x1f6e2c, 0x6bbf3a, 0x8a3a5c];
for (let c = 0; c < 7; c++) {
  const cx = (Math.random() - 0.5) * (W - 1.5), cz = -D / 2 + 0.5 + Math.random() * 1.6;
  const col = greens[c % greens.length];
  for (let i = 0; i < 6; i++) makePlant(cx + (Math.random() - 0.5) * 0.6, cz + (Math.random() - 0.5) * 0.5, 1.5 + Math.random() * 2.5, col);
}

// Пузырьки
const bubbleGeo = new THREE.SphereGeometry(1, 10, 8);
const bubbleMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, roughness: 0, metalness: 0.1 });
const bubbles = [];
const aerator = new THREE.Vector3(-4.2, floorY, 1.6);
const stone = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.2, 12), new THREE.MeshStandardMaterial({ color: 0x334455 }));
stone.position.copy(aerator).y += 0.1;
scene.add(stone);
const topY = surface.position.y;
function spawnBubble(src, spread) {
  const b = new THREE.Mesh(bubbleGeo, bubbleMat);
  const s = 0.03 + Math.random() * 0.06;
  b.scale.setScalar(s);
  b.position.set(src.x + (Math.random() - 0.5) * spread, src.y + 0.2, src.z + (Math.random() - 0.5) * spread);
  b.userData = { v: 0.8 + Math.random() * 0.8 + s * 5, ph: Math.random() * 6 };
  scene.add(b); bubbles.push(b);
}

// Корм
const foodGeo = new THREE.SphereGeometry(0.05, 6, 4);
const foodMat = new THREE.MeshStandardMaterial({ color: 0xb5651d });
const foods = [];

// ---------- Рыбки ----------
const bounds = { x: W / 2 - 0.7, yMin: floorY + 0.6, yMax: topY - 0.4, z: D / 2 - 0.6 };

function makeFish(opts) {
  const { body, fin, stripe, len } = opts;
  const fish = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: body, roughness: 0.35, metalness: 0.15 });
  const finMat = new THREE.MeshStandardMaterial({ color: fin, roughness: 0.5, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });

  // Тело — сплюснутый эллипсоид, вытянутый по X (вперёд = +X)
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 16), bodyMat);
  b.scale.set(len, opts.tall, 0.38);
  b.castShadow = true;
  fish.add(b);

  if (stripe) {
    const sMat = new THREE.MeshStandardMaterial({ color: stripe, roughness: 0.4 });
    for (const sx of [0.15, -0.2]) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 12), sMat);
      s.scale.set(0.09, opts.tall * 1.01, 0.385);
      s.position.x = sx * len;
      fish.add(s);
    }
  }

  // Глаза
  const eyeW = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
  const eyeB = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 });
  for (const side of [1, -1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), eyeW);
    e.position.set(len * 0.3, opts.tall * 0.1, side * 0.16);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.04, 10, 6), eyeB);
    p.position.set(0.015, 0, side * 0.04);
    e.add(p); fish.add(e);
  }

  // Хвост на шарнире
  const tailPivot = new THREE.Group();
  tailPivot.position.x = -len * 0.45;
  const tShape = new THREE.Shape();
  tShape.moveTo(0, 0); tShape.quadraticCurveTo(-0.3, 0.35, -0.5, 0.42); tShape.quadraticCurveTo(-0.35, 0, -0.5, -0.42); tShape.quadraticCurveTo(-0.3, -0.35, 0, 0);
  const tail = new THREE.Mesh(new THREE.ShapeGeometry(tShape), finMat);
  tail.scale.setScalar(opts.tailSize);
  tailPivot.add(tail);
  fish.add(tailPivot);

  // Спинной и грудные плавники
  const dShape = new THREE.Shape();
  dShape.moveTo(0.2, 0); dShape.quadraticCurveTo(0, 0.35, -0.3, 0.3); dShape.lineTo(-0.25, 0);
  const dorsal = new THREE.Mesh(new THREE.ShapeGeometry(dShape), finMat);
  dorsal.position.y = opts.tall * 0.42; dorsal.scale.setScalar(opts.tailSize);
  fish.add(dorsal);
  const pecs = [];
  for (const side of [1, -1]) {
    const pv = new THREE.Group();
    pv.position.set(len * 0.1, -opts.tall * 0.15, side * 0.17);
    const pf = new THREE.Mesh(new THREE.CircleGeometry(0.12, 10, 0, Math.PI), finMat);
    pf.rotation.set(-side * 1.2, 0, Math.PI);
    pv.add(pf); fish.add(pv); pecs.push({ pv, side });
  }

  fish.scale.setScalar(opts.size);
  fish.userData = {
    tailPivot, pecs,
    vel: new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) * 0.2, Math.random() - 0.5).normalize().multiplyScalar(opts.speed),
    speed: opts.speed, phase: Math.random() * 10,
    wander: new THREE.Vector3(),
  };
  fish.position.set((Math.random() - 0.5) * 2 * bounds.x, THREE.MathUtils.lerp(bounds.yMin, bounds.yMax, Math.random()), (Math.random() - 0.5) * 2 * bounds.z);
  scene.add(fish);
  return fish;
}

const species = [
  { body: 0xff7a1a, fin: 0xffffff, stripe: 0xffffff, len: 1.0, tall: 0.6, tailSize: 0.7, size: 0.8, speed: 1.0, n: 4 },   // клоун
  { body: 0x1a6dff, fin: 0xffd400, stripe: null, len: 1.1, tall: 0.75, tailSize: 0.9, size: 0.85, speed: 1.1, n: 3 },     // хирург
  { body: 0xffd23f, fin: 0xffb000, stripe: null, len: 0.8, tall: 0.95, tailSize: 0.8, size: 0.9, speed: 0.8, n: 3 },     // жёлтый танг
  { body: 0xe03a3a, fin: 0xff9a9a, stripe: null, len: 1.2, tall: 0.55, tailSize: 1.3, size: 0.7, speed: 0.9, n: 3 },     // петушок
  { body: 0x9ad8ff, fin: 0x2b6fd6, stripe: 0x1c3b8a, len: 1.3, tall: 0.45, tailSize: 0.6, size: 0.45, speed: 1.6, n: 10 }, // неоны
];
const fishes = [];
for (const s of species) for (let i = 0; i < s.n; i++) fishes.push(makeFish(s));

const tmp = new THREE.Vector3(), steer = new THREE.Vector3(), fwd = new THREE.Vector3(1, 0, 0);
function updateFish(f, dt, t) {
  const u = f.userData;
  steer.set(0, 0, 0);

  // блуждание
  u.wander.add(tmp.set(Math.random() - 0.5, (Math.random() - 0.5) * 0.4, Math.random() - 0.5).multiplyScalar(dt * 3)).clampLength(0, 1);
  steer.addScaledVector(u.wander, 0.8);

  // стены
  const p = f.position, m = 1.2;
  if (p.x > bounds.x - m) steer.x -= (p.x - bounds.x + m) * 3;
  if (p.x < -bounds.x + m) steer.x += (-bounds.x + m - p.x) * 3;
  if (p.z > bounds.z - m) steer.z -= (p.z - bounds.z + m) * 3;
  if (p.z < -bounds.z + m) steer.z += (-bounds.z + m - p.z) * 3;
  if (p.y > bounds.yMax - 0.5) steer.y -= 3;
  if (p.y < bounds.yMin + 0.5) steer.y += 3;

  // не сталкиваться друг с другом
  for (const o of fishes) {
    if (o === f) continue;
    const d = p.distanceTo(o.position);
    if (d < 0.8 && d > 0) steer.add(tmp.subVectors(p, o.position).multiplyScalar((0.8 - d) * 4 / d));
  }

  // к корму
  let target = null, best = 4;
  for (const fd of foods) { const d = p.distanceTo(fd.position); if (d < best) { best = d; target = fd; } }
  let speedMul = 1;
  if (target) {
    steer.add(tmp.subVectors(target.position, p).normalize().multiplyScalar(4));
    speedMul = 1.8;
    if (best < 0.3) { scene.remove(target); foods.splice(foods.indexOf(target), 1); }
  }

  u.vel.addScaledVector(steer, dt);
  u.vel.y *= 0.96;
  u.vel.setLength(u.speed * speedMul * (0.85 + 0.15 * Math.sin(t * 0.7 + u.phase)));
  p.addScaledVector(u.vel, dt);
  p.x = THREE.MathUtils.clamp(p.x, -bounds.x, bounds.x);
  p.y = THREE.MathUtils.clamp(p.y, bounds.yMin, bounds.yMax);
  p.z = THREE.MathUtils.clamp(p.z, -bounds.z, bounds.z);

  // плавный поворот по направлению движения
  const q = new THREE.Quaternion().setFromUnitVectors(fwd, tmp.copy(u.vel).normalize());
  f.quaternion.slerp(q, Math.min(1, dt * 4));

  // анимация хвоста и плавников
  const freq = 8 * speedMul * u.speed;
  u.phase += dt * freq;
  u.tailPivot.rotation.y = Math.sin(u.phase) * 0.5;
  for (const { pv, side } of u.pecs) pv.rotation.y = side * (0.3 + Math.sin(u.phase * 0.7) * 0.3);
}

// Кормление по клику
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downPos = null;
renderer.domElement.addEventListener('pointerdown', e => downPos = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos || Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 5) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(surface)[0] || ray.intersectObject(glass)[0];
  if (!hit) return;
  for (let i = 0; i < 8; i++) {
    const fd = new THREE.Mesh(foodGeo, foodMat);
    fd.position.set(THREE.MathUtils.clamp(hit.point.x + (Math.random() - 0.5) * 0.6, -bounds.x, bounds.x), topY - 0.05,
                    THREE.MathUtils.clamp(hit.point.z + (Math.random() - 0.5) * 0.6, -bounds.z, bounds.z));
    fd.userData.v = 0.2 + Math.random() * 0.2;
    scene.add(fd); foods.push(fd);
  }
});

// Цикл
const clock = new THREE.Clock();
let bubbleTimer = 0, chestTimer = 0;
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  plantUniforms.uTime.value = t;

  const sp = surfGeo.attributes.position;
  for (let i = 0; i < sp.count; i++) {
    const x = surfBase[i * 3], z = surfBase[i * 3 + 2];
    sp.setY(i, Math.sin(x * 1.5 + t * 1.6) * 0.04 + Math.cos(z * 2 + t * 1.2) * 0.03);
  }
  sp.needsUpdate = true; surfGeo.computeVertexNormals();

  bubbleTimer += dt; chestTimer += dt;
  if (bubbleTimer > 0.06) { bubbleTimer = 0; spawnBubble(aerator, 0.15); }
  if (chestTimer > 2.5 + Math.random()) { chestTimer = 0; for (let i = 0; i < 6; i++) spawnBubble(chestBubbleSrc, 0.3); }
  lidPivot.rotation.x = -0.35 - Math.max(0, Math.sin(t * 0.4)) * 0.25;

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.position.y += b.userData.v * dt;
    b.position.x += Math.sin(t * 3 + b.userData.ph) * 0.004;
    if (b.position.y > topY) { scene.remove(b); bubbles.splice(i, 1); }
  }
  for (let i = foods.length - 1; i >= 0; i--) {
    const fd = foods[i];
    fd.position.y -= fd.userData.v * dt;
    fd.position.x += Math.sin(t * 2 + i) * 0.002;
    if (fd.position.y < floorY + 0.1) { scene.remove(fd); foods.splice(i, 1); }
  }

  for (const f of fishes) updateFish(f, dt, t);
  blueLight.intensity = 25 + Math.sin(t * 0.8) * 8;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
